[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electromechanical-foc-sim"
version = "0.1.0"
description = "Configurable two-phase electromechanical FOC and field-weakening simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["motor_sim*"]
